services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: lusio
      POSTGRES_USER: lusio
      POSTGRES_PASSWORD: lusio
    ports:
      # Host 5433: 5432 is commonly occupied on dev machines (another
      # project's database here). CI uses 5432 via its own service.
      - "5433:5432"
    volumes:
      # PG18+ requires the mount at /var/lib/postgresql (versioned data
      # subdirectory); mounting .../data directly is rejected on startup.
      - lusio-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lusio -d lusio"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lusio-pgdata:
