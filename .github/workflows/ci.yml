name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: install / quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run db:check
      - run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  database:
    name: database integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: lusio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d lusio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 127.0.0.1, not localhost: pg v8 resolves localhost to ::1 first with
      # no IPv4 fallback, while Docker publishes the service port on IPv4 —
      # with `localhost`, drizzle-kit dies on connect without printing the
      # underlying ECONNREFUSED (verified locally against a closed port).
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lusio_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:check
      - name: Diagnose database service state
        if: always()
        run: |
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          SVC=$(docker ps -aq --filter "ancestor=postgres:18.6-alpine" | head -1)
          echo "service container: ${SVC:-none-found}"
          if [ -n "$SVC" ]; then docker logs "$SVC" 2>&1 | tail -15; fi
          (echo > /dev/tcp/127.0.0.1/5432) && echo "TCP 127.0.0.1:5432 OPEN" || echo "TCP 127.0.0.1:5432 CLOSED"
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:db
