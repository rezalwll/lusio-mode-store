name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: install / quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run db:check
      - run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Functional E2E exercises DB-backed server metadata/routes, so it needs
    # the same seeded PostgreSQL as the database job (proven service pattern).
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: lusio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lusio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lusio_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  database:
    name: database integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: lusio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        # Explicit host mapping: without `ports`, the container port is only
        # exposed inside the Docker network and unreachable from job steps.
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lusio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 127.0.0.1, not localhost: pg v8 resolves localhost to ::1 first with
      # no IPv4 fallback, while Docker publishes the service port on IPv4 —
      # with `localhost`, drizzle-kit dies on connect without printing the
      # underlying ECONNREFUSED (verified locally against a closed port).
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lusio_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:check
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:db
